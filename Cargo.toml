[package]
name = "wezzy"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
log = "0.4"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
dispatch = "0.2"
smol = "2"
parking_lot = "0.12"

# WezTerm engine, pinned to the commit of the installed WezTerm.app (20261026-082628-e68a8ec2)
config = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
env-bootstrap = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
mux = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
promise = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
portable-pty = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
termwiz = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
wezterm-input-types = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
wezterm-blob-leases = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6", features = ["simple_tempdir"] }
mux-lua = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
luahelper = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
mlua = "0.9"
wezterm-client = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
# the `wezzy` command line (cli/); the server half stays out of the app
wezzy-cli = { path = "cli", default-features = false }
procinfo = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
libc = "0.2"
nucleo-matcher = "0.3"
serde_json = "1.0.154"
shell-words = "1.1.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
objc = "0.2"
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
# already in the tree via gpui; notify.rs (UserNotifications, Dock badge)
objc2 = "0.6"
block2 = "0.6"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# One-line fix in wezterm-client; see vendor/wezterm-client/Cargo.toml.
[patch."https://github.com/wezterm/wezterm"]
wezterm-client = { path = "vendor/wezterm-client" }
mux = { path = "vendor/mux" }
