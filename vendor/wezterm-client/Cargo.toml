# Vendored from wezterm@e68a8ec with small changes:
#  - SetUserVar alerts from the server are re-published as MuxNotifications, like
#    local panes do, so the app can fire WezTerm's `user-var-changed` Lua event
#    (smart-splits' nvim -> terminal requests depend on it). (src/pane/clientpane.rs)
#  - ClientPane::seed_user_var, to fill in vars set before the client attached.
#    (src/pane/clientpane.rs)
#  - split_pane with SplitSource::MovePane sends the moved pane's remote id
#    (upstream sends the local one) and resyncs instead of adding a duplicate
#    local pane. PaneSelect's swap is built on it. (src/domain.rs)
#  - A resync updates an existing ClientPane's remote tab id when the server
#    moved it to another tab; Resize and SetPaneZoomed name that tab, and a
#    stale one leaves the real tab's split sizes wrong ("No space for split").
#    (src/domain.rs, src/pane/clientpane.rs)
#  - A resync drops a local tab the server removed when its panes now live in
#    another tab (they moved), instead of showing them twice; it takes the
#    server's workspace for an existing window; and spawn() names the new
#    window's own workspace, not the active one. (src/domain.rs)
#  - A resync fits the server's split tree to the tab size; if the server's
#    sizes disagreed (a pane wider than its tab), it resends every pane's size
#    so the server rebuilds its splits and can split again.
#    (src/domain.rs, ClientPane::send_size in src/pane/clientpane.rs)
#    At most once per REFIT_RESEND_INTERVAL per tab: each resend brings back
#    TabResized and another resync, which looped while the layout stayed off.
#  - The local layout wins over a resync's while it's ours: a resync waits
#    while our pane resizes / kills are unanswered (its tree predates them;
#    applying it made dragged dividers jump), and when the server's tree has
#    the same panes split the same ways, the local sizes are kept and resent
#    if they differ (closing a pane left the server's sizes off). A refit that
#    converges clears its resend rate limit. (src/domain.rs, layout_in_flight;
#    ClientPane::send_size / kill)
#  - One resync per burst of TabResized / TabAddedToWindow, not one each.
#    (src/client.rs, RESYNC_QUEUED)
#  - The client loop queues outgoing PDUs and keeps reading while the socket
#    is full. Upstream awaits each write without reading; the server does the
#    same, so a burst both ways could leave each blocked writing to the other
#    for good. (src/client.rs, client_thread_async)
#  - Commands spawned or split on a host's server (a domain with a workspace
#    prefix) drop this process's environment, keeping only the variables the
#    caller set, and run through /bin/sh to pick up the host's own HOME,
#    SHELL, PATH, USER and LANG. (src/domain.rs, for_host)
#  - A ClientDomain can carry a workspace prefix (with_workspace_prefix):
#    a host's server's workspaces show up as "devbox/default" and lose the
#    prefix on the way back (spawn, move, SetWindowWorkspace, renames). A
#    local rename only goes to the server whose windows are in it.
#    (src/domain.rs, src/client.rs)
#  - Coalesced wheel events (WheelUp(n)) are sent as n single ticks: the
#    terminal reports one wheel event regardless of n, so fast scrolling in
#    mouse-reporting apps (nvim) dropped ticks and jumped. (src/pane/mousestate.rs)
#  - ClientPane::kill sends KillPane at most once, and not at all for a pane the
#    server already removed: the app kills a closing pane before resizing the
#    survivors (so the server never sees their sizes with the dead pane still
#    in its tree), and Mux::remove_pane kills it again. (src/pane/clientpane.rs)
#  - A PaneFocused from the server is recorded as the focused pane before it's
#    applied, so applying it doesn't send SetFocusedPane back; echoes of two
#    quick focus changes re-sent each other forever. (src/pane/clientpane.rs)
#  - make_all_stale marks lines stale in place; upstream rebuilt the line cache
#    unbounded, so it never evicted again after the first resize / zoom /
#    palette change. (src/pane/renderable.rs)
#  - resize() compares against the size last asked of the server, not the
#    pane's dimensions (which server deltas overwrite), and resizes are one in
#    flight per pane, latest wins, under one layout op. send_size still always
#    reaches the server. (src/pane/clientpane.rs, ResizeQueue)
#  - No implicit hyperlink scan on received lines: the app finds links itself
#    and the regexes ran on the main thread per line. (src/pane/renderable.rs)
#  - A detached domain's panes don't send resizes: detaching removes them from
#    their tabs one by one, growing the rest, and those sizes would overwrite
#    the layout the server keeps for the next attach. (src/pane/clientpane.rs)
#  - Pane writes are spawned like pastes instead of blocking the UI thread on
#    the round trip. (src/pane/clientpane.rs, PaneWriter)
[package]
name = "wezterm-client"
version = "0.1.0"
authors = ["Wez Furlong <wez@wezfurlong.org>"]
edition = "2018"
publish = false
license = "MIT"

[dependencies]
anyhow = "1.0"
async-io = "2.3"
async-trait = "0.1"
async_ossl = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
codec = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
config = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
filedescriptor = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
futures = "0.3"
lazy_static = "1.4"
libc = "0.2"
log = "0.4"
lru = "0.16"
metrics = "0.23"
mux = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
openssl = "0.10.57"
parking_lot = "0.12"
portable-pty = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6", features = ["serde_support"] }
promise = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
rangeset = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
ratelim = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
smol = "2.0"
termwiz = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
textwrap = "0.16"
thiserror = "2.0"
umask = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
url = "2"
wezterm-dynamic = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6", default-features = false }
wezterm-ssh = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6", features = ["use_serde"] }
wezterm-uds = { git = "https://github.com/wezterm/wezterm", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
